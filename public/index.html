<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>Game</title>
        <meta charset="utf-8">
        <style>

            body {
                background-color: #000000;
            }
        
            #game-screen {
                border: 1px solid white;
                margin: 50px 0 auto;
                background-color: #171717;
                margin: 0 auto;
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
            }
    
            img {
                display: none;
            }
    
        </style>
    </head>

    <body>
        <canvas width="1024" height="600" id="game-screen"></canvas>
    </body>
</html>
